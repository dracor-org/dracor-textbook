name: Redirect GitHub Pages

# The textbook moved to textbook.dracor.org. GitHub Pages can't redirect a
# project site with a 301, so it gets a page that forwards to the same path on
# the new site: index.html for the start page, 404.html for all other pages.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/pages-redirect/**
      - .github/workflows/redirect-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble redirect site
        run: |
          mkdir _site
          cp .github/pages-redirect/index.html _site/index.html
          cp .github/pages-redirect/index.html _site/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
