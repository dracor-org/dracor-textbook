name: Deployment

# Builds the book and deploys it with rsync over SSH. Each GitHub environment
# has its own DEPLOY_KEY, which the server restricts to rsync into the textbook
# directory (see dracor-org-deployment), so the destination path is relative
# to it. The build runs in a job of its own, so that neither the Python
# packages nor the executed notebooks ever get access to the key.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      host:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # as in .binder/runtime.txt
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Jupyter Book (force execute)
        run: |
          jupyter-book clean docs --all
          jupyter-book build docs --all

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: docs/_build/html/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # one rsync at a time
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ inputs.host }}/
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to ${{ inputs.host }}
        env:
          HOST: ${{ inputs.host }}
        run: |
          rsync -rlvz --delete \
            -e 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes' \
            _site/ \
            "github@$HOST:/"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
