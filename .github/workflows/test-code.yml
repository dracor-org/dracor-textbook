name: test-code

# Runs all executable content (chapters and self-tests with code cells) from top
# to bottom in the Binder environment and fails if a cell raises an error.
# Optional check: it does not run automatically. Start it under
# Actions > test-code > Run workflow, choosing the branch of a pull request;
# the result then appears among the checks of that pull request.

on:
  workflow_dispatch:
    inputs:
      pattern:
        description: "Only test pages whose path contains this text (e.g. chapters/05 or assessment); empty = all"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # as in .binder/runtime.txt

      - name: Install the Binder environment
        run: |
          python -m pip install --upgrade pip
          pip install -r .binder/requirements.txt nbclient ipykernel

      - name: Run all code cells
        run: python scripts/test_executable_content.py "${{ inputs.pattern }}"
