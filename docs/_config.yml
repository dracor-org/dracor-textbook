title: "DraCor Textbook"
author: "DraCorOS Team"
copyright: "2026"
only_build_toc_files: true

repository:
  url: https://github.com/dracor-org/dracor-textbook
  path_to_book: docs
  branch: main

html:
  use_repository_button: true
  use_issues_button: true

sphinx:
  extra_extensions:
    - sphinxcontrib.bibtex
  local_extensions:
    launch_buttons_extra: _ext/
    bibtex_round: _ext/
    bibtex_year_suffix: _ext/  # 2026a, 2026b (#84)
    epub_build: _ext/
  config:
    html_logo: _static/figures/logo.png
    html_favicon: _static/figures/favicon.png
    bibtex_reference_style: author_year_round  # round brackets, see _ext/bibtex_round.py
    # Generate anchors for headings up to level 3, so that links such as
    # `file.md#exercise-1-...` can be checked by MyST.
    myst_heading_anchors: 3
    # EPUB build: jupyter-book build docs --builder custom --custom-builder epub
    project: DraCor Textbook
    epub_basename: dracor-textbook
    epub_uid: dracor-textbook
    epub_tocscope: includehidden
    epub_use_index: false
    # Cover image (source: epub-cover/cover.html) and the cover page template of Sphinx
    epub_cover: [_static/figures/epub-cover.png, epub-cover.html]
    epub_identifier: https://textbook.dracor.org/
    epub_scheme: URL
    # as in CITATION.cff
    epub_author: "Antonio Rojas Castro, Ingo Börner, Julia Jennifer Beine, Daniil Skorinkin, Peer Trilcke, Frank Fischer"
    epub_publisher: DraCor
    epub_contributor: DraCor
    epub_description: >-
      The DraCor Textbook is a curated, pedagogically structured Open
      Educational Resource (OER) for working with the programmable drama
      corpora of DraCor. This book covers corpus building, TEI encoding, the
      DraCor front-end, the DraCor API and the DraCor infrastructure.
    epub_copyright: "2026, DraCorOS Team. CC BY 4.0"
    bibtex_bibfiles:
      - references.bib
    # These html_theme_options replace the ones Jupyter Book generates from
    # `repository`, `html` and `launch_buttons`, so they are repeated here.
    html_theme_options:
      repository_url: https://github.com/dracor-org/dracor-textbook
      repository_branch: main
      path_to_docs: docs
      use_repository_button: true
      use_issues_button: true
      launch_buttons:
        binderhub_url: https://binder.eu-2.notebooks.open-science-cloud.ec.europa.eu
        notebook_interface: jupyterlab
      extra_footer: |
        <p>The DraCor Textbook has been developed in the context of “<a href="https://oscars-project.eu/projects/dracoros-fostering-open-science-digital-humanities-connecting-dracor-ecosystem-eosc">DraCorOS. Fostering Open Science in Digital Humanities by connecting the ‘DraCor’ Ecosystem to EOSC</a>”, a project funded by <a href="https://oscars-project.eu/">OSCARS</a>.</p> 
        <p>We acknowledge the <a href="https://oscars-project.eu/">OSCARS project</a>, which has received funding from the European Commission’s Horizon Europe Research and Innovation programme under grant agreement Nº. <a href="https://cordis.europa.eu/project/id/101129751">101129751</a>.</p>
        <p>This work is licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>. To view a copy of this licence, visit <a href="https://creativecommons.org/licenses/by/4.0/">https://creativecommons.org/licenses/by/4.0/</a>.</p>

parse:
  myst_enable_extensions:
    - colon_fence
    - deflist
    - linkify
    - substitution

# Execute only assessment pages (chapters are excluded from execution).
execute:
  execute_notebooks: force
  timeout: 120
  allow_errors: false
  exclude_patterns:
    - "chapters/*"